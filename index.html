<!doctype html>
<html lang="en" data-theme="phosphor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001a0d">
<title>desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- the look is symbios's mobile shell, taken as it is: its theme, its typeface, its mobile.css -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/mobile.css">
<!-- the companion's own: what it hides stays hidden, whatever display a class or a style gives it -->
<style>[hidden]{display:none!important}
/* the Assistant: the desk's chat in the phone's look; the log takes the height, the shortcuts and the line stay under the thumb */
.talk-log{display:flex;flex-direction:column;gap:8px}
.talk-me{align-self:flex-end;max-width:85%;background:var(--fg);color:var(--bg);padding:7px 11px;border-radius:8px}
.talk-it{align-self:flex-start;max-width:92%;background:var(--hair);border:1px solid var(--panel-border);padding:7px 11px;border-radius:8px;white-space:pre-wrap}
.talk-it table{border-collapse:collapse;margin-top:6px;font-size:13px;white-space:normal}
.talk-mark svg{width:.9em;height:.9em;vertical-align:-.1em;margin-right:.35em}
.talk-it th{text-align:left;font-weight:normal;color:var(--muted);padding:2px 12px 2px 0}
.talk-it td{padding:2px 12px 2px 0;vertical-align:top}
.talk-doc{padding:9px 0;border-bottom:1px solid var(--panel-border);font-size:13px}
.talk-answers{margin-top:8px}
.talk-answers .m-btn,.talk-chips .m-btn{padding:6px 12px;font-size:13px}
.talk-answers .m-btn:disabled{opacity:.4}
.talk-chips{flex:none;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}
.talk-chips .m-btn{white-space:nowrap;color:var(--muted)}
.talk-cmd,.talk-note{font-size:12px;overflow-wrap:anywhere}
.talk-form{flex:none;padding:10px 14px 14px}
</style>
</head>
<body>
  <!-- top status bar: clock · name · whether the desk is in reach -->
  <header id="statusbar">
    <span id="clock">--:--</span>
    <span class="brand">DESK</span>
    <div class="sb-right">
      <button id="conn" class="conn" aria-label="desk connection"><i class="dot"></i><span id="conn-label">…</span></button>
    </div>
  </header>

  <!-- springboard: the home grid of app tiles -->
  <!-- the claim card shows when the desk in reach has no owner yet (app.js, claimCard); the screens card when a screen asks to open the desk (screensCard) -->
  <main id="home"><div id="claim" class="m-list" style="margin-bottom:18px" hidden></div><div id="screens" class="m-list" style="margin-bottom:18px" hidden></div><div id="grid"></div></main>

  <!-- bottom dock: the same tiles, always under the thumb -->
  <nav id="dock"><div id="dock-tiles"></div></nav>
  <div id="home-indicator"></div>

  <!-- an app opens as a pane sliding in from the right -->
  <div id="pane-scrim"></div>
  <section id="pane" aria-hidden="true">
    <div class="pane-grab"></div>
    <header class="pane-head">
      <button id="pane-back" class="pane-btn" aria-label="back">&#8592;</button>
      <span id="pane-title" class="pane-title"></span>
      <span class="pane-spacer"></span>
    </header>
    <div id="pane-body" class="pane-body"></div>
  </section>

  <script src="marked.min.js"></script>
  <script src="db.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
